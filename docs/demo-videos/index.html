<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PRISM · 무대용 시연 영상</title>
<style>*{box-sizing:border-box}body{margin:0;background:#101a14;color:#e4efdf;font:15px 'Segoe UI','Malgun Gothic',sans-serif}header{padding:26px 5vw;border-bottom:1px solid #344637;display:flex;justify-content:space-between}header strong{letter-spacing:3px}header span{color:#9fb79e;font-size:12px}main{max-width:1440px;margin:auto;padding:30px}h1{font-size:28px;font-weight:400}p{color:#9fb79e;line-height:1.8}video{display:block;background:#000;width:100%;max-height:72vh;border-radius:12px;border:1px solid #3b5140}.actions{display:flex;gap:12px;margin:16px 0 24px}button,a{border:1px solid #49614b;border-radius:7px;padding:12px 18px;background:#1e3023;color:#dfefd7;cursor:pointer;text-decoration:none;font:inherit}button:hover,button.active{background:#b6dca2;color:#17271b}.scenes{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.scenes button{text-align:left;font-size:13px;line-height:1.6}.scenes small{display:block;opacity:.7;font-size:11px;margin-top:7px}@media(max-width:800px){.scenes{grid-template-columns:1fr 1fr}main{padding:18px}}</style>
<header><strong>PRISM / SCENE</strong><span>무대용 대체 영상 · 오프라인 재생</span></header><main><h1 id="title">햇살 드는 유리 테이블 방</h1><p>배경 선택부터 3D 탐색, 그래프, 물체 배치와 결과 저장까지.</p><video id="player" controls preload="metadata" src="sunroom.mp4" poster="../screenshots/demo-stage6-sunroom-graph.png"></video><div class="actions"><button id="play">영상 재생</button><button id="full">전체 화면</button><a id="download" href="sunroom.mp4" download>MP4 다운로드</a></div><div class="scenes" id="scenes"></div></main>
<script>const data=[['sunroom','햇살 드는 유리 테이블 방'],['ceramics','도자기와 꽃 정물'],['d4f646fcc79650d6','장바구니를 실은 자동차'],['hall','조각상이 있는 전시 홀']],player=document.querySelector('#player');for(const [id,title]of data){const button=document.createElement('button');button.textContent=title;const small=document.createElement('small');small.textContent='선택 → 탐색 → 그래프 → 배치 → 저장';button.append(small);button.classList.toggle('active',id==='sunroom');button.onclick=()=>{player.src=id+'.mp4';player.poster='../screenshots/demo-stage6-'+id+'-graph.png';document.querySelector('#title').textContent=title;document.querySelector('#download').href=id+'.mp4';document.querySelectorAll('.scenes button').forEach(b=>b.classList.toggle('active',b===button));player.play().catch(()=>{});};document.querySelector('#scenes').append(button);}document.querySelector('#play').onclick=()=>player.paused?player.play():player.pause();document.querySelector('#full').onclick=()=>player.requestFullscreen();</script></html>
