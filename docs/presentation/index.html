<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PRISM · 최종 발표 결과</title>
<style>body{margin:0;padding:40px;background:#0b1722;color:#e6f3f7;font:16px/1.6 system-ui,"Malgun Gothic",sans-serif}main{max-width:1440px;margin:auto}h1{font-size:32px}p{color:#8cafbc}section{display:grid;grid-template-columns:1fr 1fr;gap:24px}article{border:1px solid #304d5c;border-radius:14px;overflow:hidden;background:#102431}img{width:100%;display:block}a{color:#91e0e9;text-decoration:none}h2{font-size:16px;margin:15px 20px}article:last-child{grid-column:1/-1}@media(max-width:800px){section{grid-template-columns:1fr}}</style>
<main><h1>PRISM · 최종 발표 결과</h1><p>물류 창고 한 장면으로 통일 · PNG 10장 + 12초 GIF · 1920×1080<br>이미지 또는 제목을 누르면 원본 파일이 열립니다.</p><section id="gallery"></section></main>
<script>const names=['01_대표.png','02_현장복원.png','03_자산인식.png','04_관계그래프.png','05_메시생성.png','06_사양카드.png','07_배치전후.png','08_간섭경고.png','09_대장갱신.png','10_리포트.png','11_시연.gif'];for(const name of names){const a=document.createElement('article');const link=document.createElement('a');link.href=name;const img=document.createElement('img');img.src=name;img.alt=name;img.loading='lazy';const h=document.createElement('h2');h.textContent=name;link.append(img,h);a.append(link);document.querySelector('#gallery').append(a);}</script></html>
